name: Prepare provider release candidate
run-name: ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing signed provider tag from release/version.json
        required: true
        type: string
      expected_commit:
        description: Exact approved 40-character tag commit
        required: true
        type: string
      request_id:
        description: Exact lowercase UUIDv4 correlation token generated by the owner deploy entrypoint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SYFT_VERSION: "1.48.0"
  SYFT_LINUX_AMD64_SHA256: "6cef9a7f37220d9067eaf9cfaaa2fce986e9f320a8d42cbc36658c99af78ea04"
  EXPECTED_GPG_FINGERPRINT: "3510E75E05BBCC303B92D77934FC18AC897FB709"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact signed-tag workflow and release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the immutable signed-tag workflow and source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be one exact lowercase canonical UUIDv4" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Provider preparation must execute the exact signed release tag" >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          test "$GITHUB_WORKFLOW_REF" = "$expected_workflow_ref"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$(jq -r .tag release/version.json)" != "$RELEASE_TAG" || "v$(jq -r .version release/version.json)" != "$RELEASE_TAG" ]]; then
            echo "tag must exactly match the provider release descriptor" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be an exact lowercase 40-character Git commit" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$tag_commit" = "$EXPECTED_COMMIT"
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          tag_object_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$tag_object_oid")" = "tag"
          remote_tag_object_oid="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NF == 2 { print $1 }')"
          test "$remote_tag_object_oid" = "$tag_object_oid"
          fingerprints="$(gpg --batch --with-colons --import-options show-only --import release/keys/provider-signing-key.asc | awk -F: '$1 == "fpr" { print $10 }')"
          test "$fingerprints" = "$EXPECTED_GPG_FINGERPRINT"
          gpg --batch --import release/keys/provider-signing-key.asc
          verification="$(git verify-tag --raw "$RELEASE_TAG" 2>&1)"
          grep -F "[GNUPG:] VALIDSIG $EXPECTED_GPG_FINGERPRINT " <<<"$verification"

      - name: Check out the untrusted tagged provider source separately
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            release-source/go.sum
            release-source/cmd/provider-release/go.sum

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # pinned: v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Execute all candidate code in this read-only job
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-source rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git -C release-source status --porcelain=v1 --untracked-files=all)"
          test "$(jq -r .tag release-source/release/version.json)" = "$RELEASE_TAG"
          go -C release-source run ./cmd/standard-form-conformance candidate-publication-check
          go -C release-source/cmd/provider-release test ./...
          go -C release-source/cmd/provider-release run . verify-source --expected-trigger-tag "$RELEASE_TAG"

      - name: Materialize exact Registry manifest asset
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-source/.release-tmp
          install -m 0644 release-source/terraform-registry-manifest.json \
            "release-source/.release-tmp/terraform-provider-takoform_${version}_manifest.json"

      - name: Install pinned Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/$archive"
          printf '%s  %s\n' "$SYFT_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" syft
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/syft" "$RUNNER_TEMP/bin/syft"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the first final unsigned release inventory
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --config ../.goreleaser.yml --clean --skip=publish,sign
          workdir: release-source

      - name: Capture the first final archive set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goreleaser-final-1"
          cp release-source/dist/*.zip "$RUNNER_TEMP/goreleaser-final-1/"

      - name: Perturb only source mtime and prove the tagged tree stays clean
        shell: bash
        run: |
          set -euo pipefail
          touch -m -d '2040-01-02T03:04:05Z' release-source/LICENSE
          test -z "$(git -C release-source status --porcelain=v1 --untracked-files=all)"

      - name: Build the second and final unsigned release inventory
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --config ../.goreleaser.yml --clean --skip=publish,sign
          workdir: release-source

      - name: Verify the exact final archives are reproducible
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/goreleaser-final-1"
          final="$GITHUB_WORKSPACE/release-source/dist"
          find "$first" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/first-final-archives.txt"
          find "$final" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/second-final-archives.txt"
          test "$(wc -l < "$RUNNER_TEMP/first-final-archives.txt")" -eq 5
          diff -u "$RUNNER_TEMP/first-final-archives.txt" "$RUNNER_TEMP/second-final-archives.txt"
          mapfile -t names < "$RUNNER_TEMP/first-final-archives.txt"
          for name in "${names[@]}"; do
            cmp -s "$first/$name" "$final/$name"
            test "$(sha256sum "$first/$name" | cut -d' ' -f1)" = "$(sha256sum "$final/$name" | cut -d' ' -f1)"
          done

      - name: Exercise the exact final linux amd64 provider bytes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          version="${RELEASE_TAG#v}"
          archive="$GITHUB_WORKSPACE/release-source/dist/terraform-provider-takoform_${version}_linux_amd64.zip"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          extracted="$RUNNER_TEMP/final-linux-amd64-provider"
          mkdir -m 0700 "$extracted"
          entry="terraform-provider-takoform_v${version}"
          printf '%s\n' LICENSE "$entry" | sort > "$RUNNER_TEMP/expected-final-archive-entries.txt"
          unzip -Z1 "$archive" | sort > "$RUNNER_TEMP/actual-final-archive-entries.txt"
          diff -u "$RUNNER_TEMP/expected-final-archive-entries.txt" "$RUNNER_TEMP/actual-final-archive-entries.txt"
          binary="$extracted/terraform-provider-takoform"
          unzip -p "$archive" "$entry" > "$binary"
          chmod 0755 "$binary"
          test "$("$binary" -version)" = "$version"
          binary_sha256="sha256:$(sha256sum "$binary" | cut -d' ' -f1)"
          report="$RUNNER_TEMP/final-provider-lifecycle-matrix.json"
          go -C release-source run ./cmd/provider-lifecycle-conformance render-matrix \
            --opentofu tofu \
            --terraform terraform \
            --provider-binary "$binary" > "$report"
          jq -e --arg version "$version" --arg sha256 "$binary_sha256" '
            .installationSource == "local-dev-override" and
            (.reports | length) == 2 and
            all(.reports[];
              .installationSource == "local-dev-override" and
              .providerBinary.version == $version and
              .providerBinary.sha256 == $sha256)
          ' "$report" >/dev/null
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$archive_sha256"
          test "sha256:$(sha256sum "$binary" | cut -d' ' -f1)" = "$binary_sha256"
          test -z "$(git -C release-source status --porcelain=v1 --untracked-files=all)"

      - name: Validate final Syft SBOMs against the pinned SPDX schema
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sboms < <(find "$GITHUB_WORKSPACE/release-source/dist" -maxdepth 1 -type f -name '*.zip.spdx.json' -print | sort)
          if [[ "${#sboms[@]}" -ne 5 ]]; then
            echo "Expected five final provider SBOMs, got ${#sboms[@]}" >&2
            exit 1
          fi
          go -C cmd/provider-release run . verify-sbom "${sboms[@]}"

      - name: Close and export the unsigned inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          output="$RUNNER_TEMP/provider-release"
          mkdir -p "$output"
          cp release-source/dist/*.zip release-source/dist/*.spdx.json "$output/"
          install -m 0644 "release-source/.release-tmp/terraform-provider-takoform_${version}_manifest.json" "$output/"
          expected="$RUNNER_TEMP/expected-unsigned-assets.txt"
          {
            for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
              archive="terraform-provider-takoform_${version}_${platform}.zip"
              printf '%s\n' "$archive" "${archive}.spdx.json"
            done
            printf '%s\n' "terraform-provider-takoform_${version}_manifest.json"
          } | sort > "$expected"
          find "$output" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-unsigned-assets.txt"
          diff -u "$expected" "$RUNNER_TEMP/actual-unsigned-assets.txt"
          terraform_checksum_targets="$RUNNER_TEMP/terraform-registry-checksum-assets.txt"
          opentofu_checksum_targets="$RUNNER_TEMP/opentofu-registry-checksum-assets.txt"
          go -C cmd/provider-release run . registry-checksum-targets --product Terraform > "$terraform_checksum_targets"
          go -C cmd/provider-release run . registry-checksum-targets --product OpenTofu > "$opentofu_checksum_targets"
          diff -u "$terraform_checksum_targets" "$opentofu_checksum_targets"
          expected_registry_checksums="$RUNNER_TEMP/expected-registry-checksum-assets.txt"
          install -m 0644 "$terraform_checksum_targets" "$expected_registry_checksums"
          mapfile -t checksum_targets < "$expected_registry_checksums"
          checksum="terraform-provider-takoform_${version}_SHA256SUMS"
          (cd "$output" && for name in "${checksum_targets[@]}"; do sha256sum "$name"; done > "$checksum")
          (cd "$output" && sha256sum --check --strict "$checksum")
          awk 'NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 ~ /\// { exit 1 } { print $2 }' "$output/$checksum" \
            | sort > "$RUNNER_TEMP/checksum-assets.txt"
          diff -u "$expected_registry_checksums" "$RUNNER_TEMP/checksum-assets.txt"

      - name: Upload only the closed unsigned inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-provider-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-release
          if-no-files-found: error
          retention-days: 1

  prepare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-release
    permissions:
      contents: read
    steps:
      - name: Check out the same exact signed-tag workflow without Git write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the read-only build inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-provider-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-release

      - name: Statically verify the exact source and unsigned inventory
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be one exact lowercase canonical UUIDv4" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Provider preparation must execute the exact signed release tag" >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          test "$GITHUB_WORKFLOW_REF" = "$expected_workflow_ref"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$(jq -r .tag release/version.json)" != "$RELEASE_TAG" || "v$(jq -r .version release/version.json)" != "$RELEASE_TAG" ]]; then
            echo "tag must exactly match the provider release descriptor" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be an exact lowercase 40-character Git commit" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$tag_commit" = "$EXPECTED_COMMIT"
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          fingerprints="$(gpg --batch --with-colons --import-options show-only --import release/keys/provider-signing-key.asc | awk -F: '$1 == "fpr" { print $10 }')"
          test "$fingerprints" = "$EXPECTED_GPG_FINGERPRINT"
          gpg --batch --import release/keys/provider-signing-key.asc
          verification="$(git verify-tag --raw "$RELEASE_TAG" 2>&1)"
          grep -F "[GNUPG:] VALIDSIG $EXPECTED_GPG_FINGERPRINT " <<<"$verification"
          tag_object_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$tag_object_oid")" = "tag"
          remote_tag_object_oid="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NF == 2 { print $1 }')"
          test "$remote_tag_object_oid" = "$tag_object_oid"
          tag_object="$RUNNER_TEMP/provider-release-tag-object"
          git cat-file tag "$tag_object_oid" > "$tag_object"
          test "$(git hash-object -t tag "$tag_object")" = "$tag_object_oid"
          tag_object_sha256="sha256:$(sha256sum "$tag_object" | cut -d' ' -f1)"
          version="${RELEASE_TAG#v}"
          output="$RUNNER_TEMP/provider-release"
          checksum="$output/terraform-provider-takoform_${version}_SHA256SUMS"
          manifest="$output/terraform-provider-takoform_${version}_manifest.json"
          test -f "$checksum"
          test -f "$manifest"
          expected_unsigned="$RUNNER_TEMP/expected-unsigned-assets.txt"
          expected_registry_checksums="$RUNNER_TEMP/expected-registry-checksum-assets.txt"
          {
            for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
              archive="terraform-provider-takoform_${version}_${platform}.zip"
              printf '%s\n' "$archive" "${archive}.spdx.json"
            done
            printf '%s\n' "$(basename "$manifest")"
          } | sort > "$expected_unsigned"
          {
            for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
              printf '%s\n' "terraform-provider-takoform_${version}_${platform}.zip"
            done
            printf '%s\n' "terraform-provider-takoform_${version}_manifest.json"
          } | sort > "$expected_registry_checksums"
          {
            cat "$expected_unsigned"
            printf '%s\n' "$(basename "$checksum")"
          } | sort > "$RUNNER_TEMP/expected-unsigned-inventory.txt"
          find "$output" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-unsigned-inventory.txt"
          diff -u "$RUNNER_TEMP/expected-unsigned-inventory.txt" "$RUNNER_TEMP/actual-unsigned-inventory.txt"
          (cd "$output" && sha256sum --check --strict "$(basename "$checksum")")
          awk 'NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || $2 ~ /\// { exit 1 } { print $2 }' "$checksum" \
            | sort > "$RUNNER_TEMP/checksum-assets.txt"
          diff -u "$expected_registry_checksums" "$RUNNER_TEMP/checksum-assets.txt"
          github_releases_control="$RUNNER_TEMP/provider-release-capability-control.json"
          if ! github_repository_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$github_releases_control" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=1")"; then
            echo "Could not prove GitHub Release read capability" >&2
            exit 1
          fi
          if [[ "$github_repository_status" != "200" ]]; then
            echo "GitHub Release capability control expected 200, got $github_repository_status" >&2
            exit 1
          fi
          jq -e 'type == "array"' "$github_releases_control" >/dev/null
          encoded_release_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          if ! github_release_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/github-release-preflight.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_release_tag")"; then
            echo "Could not prove GitHub release absence for $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$github_release_status" == "200" ]]; then
            echo "A GitHub release already owns $RELEASE_TAG; refusing overwrite" >&2
            exit 1
          fi
          if [[ "$github_release_status" != "404" ]]; then
            echo "GitHub release absence preflight expected 404, got $github_release_status; refusing publication preparation" >&2
            exit 1
          fi
          if ! registry_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.terraform.io/v1/providers/tako0614/takoform/$version/download/linux/amd64")"; then
            echo "Could not prove Terraform Registry version absence for $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$registry_status" != "404" ]]; then
            echo "Terraform Registry version preflight expected 404, got $registry_status; refusing overwrite" >&2
            exit 1
          fi
          {
            echo "output=$output"
            echo "checksum=$checksum"
            echo "tag=$RELEASE_TAG"
            echo "source_commit=$tag_commit"
            echo "tooling_commit=$GITHUB_SHA"
            echo "tag_object_oid=$tag_object_oid"
            echo "tag_object_sha256=$tag_object_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Import provider signing key only after static verification
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Sign the exact closed checksum inventory
        shell: bash
        env:
          IMPORTED_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [[ "$IMPORTED_FINGERPRINT" != "$EXPECTED_GPG_FINGERPRINT" ]]; then
            echo "Imported signing key fingerprint does not match the pinned provider signer" >&2
            exit 1
          fi
          checksum="${{ steps.inventory.outputs.checksum }}"
          signature="${checksum}.sig"
          test ! -e "$signature"
          gpg --batch --local-user "$EXPECTED_GPG_FINGERPRINT" --output "$signature" --detach-sign "$checksum"
          gpg --batch --verify "$signature" "$checksum"
          {
            cat "$RUNNER_TEMP/expected-unsigned-inventory.txt"
            printf '%s\n' "$(basename "$signature")"
          } | sort > "$RUNNER_TEMP/expected-payload-inventory.txt"
          test "$(wc -l < "$RUNNER_TEMP/expected-payload-inventory.txt")" -eq 13

          output="$(dirname "$checksum")"
          payload_metadata="$RUNNER_TEMP/provider-release-provenance-subjects.tsv"
          : > "$payload_metadata"
          while IFS= read -r name; do
            [[ "$name" != */* ]]
            size="$(stat --printf='%s' "$output/$name")"
            digest="$(sha256sum "$output/$name" | cut -d' ' -f1)"
            [[ "$size" =~ ^[1-9][0-9]*$ ]]
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s\t%s\t%s\n' "$name" "$size" "$digest" >> "$payload_metadata"
          done < "$RUNNER_TEMP/expected-payload-inventory.txt"
          test "$(wc -l < "$payload_metadata")" -eq 13

          base="${checksum%_SHA256SUMS}"
          provenance="${base}_provenance.intoto.json"
          provenance_signature="${provenance}.sig"
          invocation_id="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          export PROVENANCE_PATH="$provenance"
          export PAYLOAD_METADATA_PATH="$payload_metadata"
          export RELEASE_TAG="${{ steps.inventory.outputs.tag }}"
          export SOURCE_COMMIT="${{ steps.inventory.outputs.source_commit }}"
          export TOOLING_COMMIT="${{ steps.inventory.outputs.tooling_commit }}"
          export TAG_OBJECT_OID="${{ steps.inventory.outputs.tag_object_oid }}"
          export TAG_OBJECT_SHA256="${{ steps.inventory.outputs.tag_object_sha256 }}"
          export INVOCATION_ID="$invocation_id"
          node <<'NODE'
          const fs = require("node:fs");
          const env = process.env;
          const ascii = (value, name) => {
            if (typeof value !== "string" || !/^[\x20-\x7e]+$/.test(value)) {
              throw new Error(`${name} must be non-empty printable ASCII`);
            }
            return value;
          };
          const exact = (value, pattern, name) => {
            ascii(value, name);
            if (!pattern.test(value)) throw new Error(`${name} has invalid canonical form`);
            return value;
          };
          const tag = exact(env.RELEASE_TAG, /^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/, "tag");
          const version = tag.slice(1);
          const requestId = exact(env.REQUEST_ID, /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/, "requestId");
          const sourceCommit = exact(env.SOURCE_COMMIT, /^[0-9a-f]{40}$/, "sourceCommit");
          const toolingCommit = exact(env.TOOLING_COMMIT, /^[0-9a-f]{40}$/, "toolingCommit");
          if (sourceCommit !== toolingCommit) throw new Error("source and tooling commits must be identical");
          const tagObjectOid = exact(env.TAG_OBJECT_OID, /^[0-9a-f]{40}$/, "tagObjectOid");
          const tagObjectSha256 = exact(env.TAG_OBJECT_SHA256, /^sha256:[0-9a-f]{64}$/, "tagObjectSha256");
          const runId = exact(env.GITHUB_RUN_ID, /^[1-9][0-9]*$/, "runId");
          const runAttempt = exact(env.GITHUB_RUN_ATTEMPT, /^[1-9][0-9]*$/, "runAttempt");
          const repository = exact(env.GITHUB_REPOSITORY, /^tako0614\/terraform-provider-takoform$/, "repository");
          const workflowPath = ".github/workflows/release.yml";
          const workflowRef = `${repository}/${workflowPath}@refs/tags/${tag}`;
          if (env.GITHUB_WORKFLOW_REF !== workflowRef) throw new Error("workflow ref mismatch");
          const invocationId = `https://github.com/${repository}/actions/runs/${runId}/attempts/${runAttempt}`;
          if (env.INVOCATION_ID !== invocationId) throw new Error("invocation id mismatch");
          const rows = fs.readFileSync(env.PAYLOAD_METADATA_PATH, "utf8").trimEnd().split("\n").map((line) => {
            const fields = line.split("\t");
            if (fields.length !== 3) throw new Error("invalid payload metadata row");
            const [name, sizeText, sha256] = fields;
            exact(name, /^[A-Za-z0-9._-]+$/, "subject name");
            exact(sha256, /^[0-9a-f]{64}$/, "subject sha256");
            exact(sizeText, /^[1-9][0-9]*$/, "subject size");
            const size = Number(sizeText);
            if (!Number.isSafeInteger(size) || size <= 0) throw new Error("subject size exceeds the safe integer domain");
            return {name, digest: {sha256}, annotations: {size}};
          });
          const platforms = ["darwin_amd64", "darwin_arm64", "linux_amd64", "linux_arm64", "windows_amd64"];
          const base = `terraform-provider-takoform_${version}`;
          const expectedNames = platforms.flatMap((platform) => {
            const archive = `${base}_${platform}.zip`;
            return [archive, `${archive}.spdx.json`];
          }).concat(`${base}_manifest.json`, `${base}_SHA256SUMS`, `${base}_SHA256SUMS.sig`).sort();
          const subjectNames = rows.map(({name}) => name);
          if (rows.length !== 13 || JSON.stringify(subjectNames) !== JSON.stringify(expectedNames)) {
            throw new Error("provenance subjects do not exactly close the sorted 13-file payload");
          }
          const statement = {
            "_type": "https://in-toto.io/Statement/v1",
            subject: rows,
            predicateType: "https://slsa.dev/provenance/v1",
            predicate: {
              buildDefinition: {
                buildType: "https://takoform.com/buildtypes/provider-release/v1",
                externalParameters: {tag, requestId},
                internalParameters: {
                  canonicalization: "RFC8785",
                  sourceCommit,
                  toolingCommit,
                  workflow: {path: workflowPath, ref: workflowRef},
                  run: {id: runId, attempt: runAttempt},
                  tagObject: {oid: tagObjectOid, sha256: tagObjectSha256},
                },
                resolvedDependencies: [
                  {
                    name: "signed-provider-tag",
                    uri: `git+https://github.com/${repository}@refs/tags/${tag}`,
                    digest: {gitCommit: sourceCommit, gitTagObject: tagObjectOid, sha256: tagObjectSha256.slice(7)},
                  },
                  {
                    name: "signed-tag-release-tooling",
                    uri: `git+https://github.com/${repository}@${toolingCommit}`,
                    digest: {gitCommit: toolingCommit},
                  },
                ],
              },
              runDetails: {
                builder: {id: `https://github.com/${workflowRef}`},
                metadata: {invocationId},
              },
            },
          };
          const recursivelySort = (value) => {
            if (Array.isArray(value)) return value.map(recursivelySort);
            if (value !== null && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, recursivelySort(value[key])]));
            }
            return value;
          };
          fs.writeFileSync(env.PROVENANCE_PATH, JSON.stringify(recursivelySort(statement)), {flag: "wx", mode: 0o644});
          NODE
          test -s "$provenance"

          test ! -e "$provenance_signature"
          gpg --batch --local-user "$EXPECTED_GPG_FINGERPRINT" --output "$provenance_signature" --detach-sign "$provenance"
          gpg --batch --verify "$provenance_signature" "$provenance"
          gpg --batch --yes --delete-secret-keys "$EXPECTED_GPG_FINGERPRINT"
          if gpg --batch --with-colons --list-secret-keys "$EXPECTED_GPG_FINGERPRINT" | grep -q '^sec:'; then
            echo "Provider signing key remains available after signing" >&2
            exit 1
          fi
          gpgconf --kill gpg-agent
          {
            cat "$RUNNER_TEMP/expected-payload-inventory.txt"
            printf '%s\n' "$(basename "$provenance")" "$(basename "$provenance_signature")"
          } | sort > "$RUNNER_TEMP/expected-signed-inventory.txt"
          test "$(wc -l < "$RUNNER_TEMP/expected-signed-inventory.txt")" -eq 15
          find "$(dirname "$checksum")" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-signed-inventory.txt"
          diff -u "$RUNNER_TEMP/expected-signed-inventory.txt" "$RUNNER_TEMP/actual-signed-inventory.txt"

      - name: Package this run's checksum-closed local publication candidate
        id: candidate
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          output="${{ steps.inventory.outputs.output }}"
          candidate="$RUNNER_TEMP/provider-release-candidate"
          assets="$candidate/assets"
          test ! -e "$candidate"
          mkdir -p "$assets"
          while IFS= read -r name; do
            install -m 0644 "$output/$name" "$assets/$name"
          done < "$RUNNER_TEMP/expected-signed-inventory.txt"

          find "$assets" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | sort > "$RUNNER_TEMP/candidate-assets.txt"
          diff -u "$RUNNER_TEMP/expected-signed-inventory.txt" "$RUNNER_TEMP/candidate-assets.txt"
          test "$(wc -l < "$RUNNER_TEMP/candidate-assets.txt")" -eq 15

          asset_metadata="$RUNNER_TEMP/provider-release-assets.jsonl"
          : > "$asset_metadata"
          while IFS= read -r name; do
            digest="$(sha256sum "$assets/$name" | cut -d' ' -f1)"
            jq -cn --arg name "$name" --arg sha256 "sha256:$digest" \
              '{name: $name, sha256: $sha256}' >> "$asset_metadata"
          done < "$RUNNER_TEMP/candidate-assets.txt"

          jq -S -n \
            --arg format "takoform.provider-release-candidate.v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowPath ".github/workflows/release.yml" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg requestId "$REQUEST_ID" \
            --arg tag "${{ steps.inventory.outputs.tag }}" \
            --arg sourceCommit "${{ steps.inventory.outputs.source_commit }}" \
            --arg toolingCommit "${{ steps.inventory.outputs.tooling_commit }}" \
            --arg tagObjectOid "${{ steps.inventory.outputs.tag_object_oid }}" \
            --arg tagObjectSha256 "${{ steps.inventory.outputs.tag_object_sha256 }}" \
            --slurpfile assets "$asset_metadata" \
            '{
              format: $format,
              repository: $repository,
              workflowPath: $workflowPath,
              workflowRef: $workflowRef,
              runId: $runId,
              attempt: $attempt,
              requestId: $requestId,
              tag: $tag,
              sourceCommit: $sourceCommit,
              toolingCommit: $toolingCommit,
              tagObjectOid: $tagObjectOid,
              tagObjectSha256: $tagObjectSha256,
              assetCount: ($assets | length),
              assets: $assets
            }' > "$candidate/metadata.json"
          test "$(jq -r '.assetCount' "$candidate/metadata.json")" -eq 15

          (
            cd "$candidate"
            {
              printf '%s\0' metadata.json
              find assets -mindepth 1 -maxdepth 1 -type f -print0
            } | sort -z | xargs -0 sha256sum > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 16
            sha256sum --check --strict SHA256SUMS
          )

          {
            printf '%s\n' SHA256SUMS assets metadata.json
          } | sort > "$RUNNER_TEMP/expected-candidate-root.txt"
          find "$candidate" -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | sort > "$RUNNER_TEMP/actual-candidate-root.txt"
          diff -u "$RUNNER_TEMP/expected-candidate-root.txt" "$RUNNER_TEMP/actual-candidate-root.txt"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Upload the same-run local publication candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the same trusted workflow commit without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/provider-release/go.sum

      - name: Download the same-run signed candidate without signing secrets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-release-candidate

      - name: Rebuild and verify the exact canonical provenance contract
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          tag_object_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$tag_object_oid")" = "tag"
          remote_tag_object_oid="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NF == 2 { print $1 }')"
          test "$remote_tag_object_oid" = "$tag_object_oid"
          tag_object="$RUNNER_TEMP/provider-release-tag-object"
          git cat-file tag "$tag_object_oid" > "$tag_object"
          test "$(git hash-object -t tag "$tag_object")" = "$tag_object_oid"
          tag_object_sha256="sha256:$(sha256sum "$tag_object" | cut -d' ' -f1)"
          candidate="$RUNNER_TEMP/provider-release-candidate"
          {
            printf '%s\n' SHA256SUMS assets metadata.json
          } | sort > "$RUNNER_TEMP/expected-candidate-root.txt"
          find "$candidate" -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | sort > "$RUNNER_TEMP/actual-candidate-root.txt"
          diff -u "$RUNNER_TEMP/expected-candidate-root.txt" "$RUNNER_TEMP/actual-candidate-root.txt"
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)
          go -C cmd/provider-release run . verify-release-provenance \
            --assets "$candidate/assets" \
            --expected-tag "$RELEASE_TAG" \
            --expected-source-commit "$EXPECTED_COMMIT" \
            --expected-tooling-commit "$GITHUB_SHA" \
            --expected-request-id "$REQUEST_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-tag-object-oid "$tag_object_oid" \
            --expected-tag-object-sha256 "$tag_object_sha256"
