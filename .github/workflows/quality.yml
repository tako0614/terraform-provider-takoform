name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: takoform-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # pinned: v6.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/provider-release/go.sum

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # pinned: v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Run the complete portable product gate
        run: bun run check

      # bun run check builds and runs every package, but `go test` alone cannot
      # observe a data race. The lanes below own concurrent state — an HTTP
      # client with retry/poll loops, a provider the CLI drives in parallel, and
      # an in-memory reference host — so they are re-run under the race
      # detector.
      - name: Run the concurrent lanes under the race detector
        run: >-
          go test -race
          ./internal/clientv3/...
          ./internal/provider/...
          ./internal/portableconformancev3/...

      # Every tracked generated tree must already be the output of its
      # generator. Running them here proves a change set regenerated what it
      # touched instead of hand-editing it.
      - name: Prove every generated surface is reproducible
        run: |
          bun run build:current-form-families
          bun run sync:portable-host-v1beta1
          go run ./cmd/standard-form-conformance generate-current-surfaces
          bun run sync:public-schemas
          bun run sync:website-docs
          bun run sync:website-spec
          git diff --exit-code

      - name: Enforce append-only revocation sources
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          go run ./cmd/form-package-release check-revocations
          --base "${{ github.event.pull_request.base.sha }}"
