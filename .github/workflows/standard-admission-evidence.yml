name: Build signed Standard Form admission evidence

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Canonical UUIDv4 generated by the exact owner dispatch request
        required: true
        type: string
      host_id:
        description: Reviewed conforming host in admission/v4/conforming-hosts.json that signed the host reports
        required: true
        type: string
      snapshot_commit:
        description: Exact retained-report snapshot commit
        required: true
        type: string
      snapshot_tree:
        description: Exact Git tree for the retained-report snapshot
        required: true
        type: string
      host_candidate_path:
        description: Retained host-report candidate directory
        required: true
        type: string
      host_candidate_tree:
        description: Exact Git tree for the retained host candidate
        required: true
        type: string
      host_source_commit:
        description: Exact conforming-host source commit authenticated by the host candidate
        required: true
        type: string
      host_takoform_source_commit:
        description: Exact Takoform source commit executed by the host candidate
        required: true
        type: string
      host_run_id:
        description: Exact protected host workflow run retained in source
        required: true
        type: string
      host_request_id:
        description: Exact lowercase UUIDv4 that selected the retained host workflow run
        required: true
        type: string
      host_run_attempt:
        description: Exact host workflow run attempt retained in source
        required: true
        type: string
      host_head_sha:
        description: Exact host workflow head SHA retained in signed metadata
        required: true
        type: string
      host_manifest_digest:
        description: SHA-256 of the retained host manifest
        required: true
        type: string
      host_signed_manifest_digest:
        description: SHA-256 of the retained signed host candidate
        required: true
        type: string
      provider_candidate_path:
        description: Retained provider-report candidate directory
        required: true
        type: string
      provider_candidate_tree:
        description: Exact Git tree for the retained provider candidate
        required: true
        type: string
      provider_source_commit:
        description: Exact Takoform source commit executed by the provider candidate
        required: true
        type: string
      provider_run_id:
        description: Exact protected provider workflow run retained in source
        required: true
        type: string
      provider_request_id:
        description: Exact lowercase UUIDv4 that selected the retained provider workflow run
        required: true
        type: string
      provider_run_attempt:
        description: Exact provider workflow run attempt retained in source
        required: true
        type: string
      provider_head_sha:
        description: Exact provider workflow head SHA retained in signed metadata
        required: true
        type: string
      provider_manifest_digest:
        description: SHA-256 of the retained provider manifest
        required: true
        type: string
      provider_signed_manifest_digest:
        description: SHA-256 of the retained signed provider candidate
        required: true
        type: string
      registry_candidate_path:
        description: Retained provider Registry-readback candidate directory
        required: true
        type: string
      registry_candidate_tree:
        description: Exact Git tree for the retained Registry candidate
        required: true
        type: string
      registry_run_id:
        description: Exact protected Registry-readback workflow run retained in source
        required: true
        type: string
      registry_request_id:
        description: Exact lowercase UUIDv4 that selected the retained Registry workflow run
        required: true
        type: string
      registry_run_attempt:
        description: Exact Registry workflow run attempt retained in source
        required: true
        type: string
      registry_head_sha:
        description: Exact Registry workflow head SHA retained in signed metadata
        required: true
        type: string
      registry_manifest_digest:
        description: SHA-256 of the retained Registry candidate manifest
        required: true
        type: string
      registry_signed_manifest_digest:
        description: SHA-256 of the retained signed Registry candidate
        required: true
        type: string
      admission_version:
        description: Immutable source-retained admission checkpoint version to assemble
        required: true
        type: string

run-name: ${{ inputs.request_id }}

concurrency:
  group: standard-admission-evidence-${{ github.sha }}-${{ inputs.request_id }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"
  HOST_ID: ${{ inputs.host_id }}
  PROVIDER_REPORT_IDENTITY: https://github.com/tako0614/terraform-provider-takoform/.github/workflows/standard-provider-report.yml@refs/heads/main
  REGISTRY_READBACK_IDENTITY: https://github.com/tako0614/terraform-provider-takoform/.github/workflows/provider-registry-readback.yml@refs/heads/main
  EVIDENCE_IDENTITY: https://github.com/tako0614/terraform-provider-takoform/.github/workflows/standard-admission-evidence.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  assemble:
    name: Authenticate reports and assemble deterministic material
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_commit_short: ${{ steps.source.outputs.source_commit_short }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.snapshot_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the assembly to one protected-main attempt
        id: source
        shell: bash
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
          SNAPSHOT_TREE: ${{ inputs.snapshot_tree }}
          HOST_CANDIDATE_PATH: ${{ inputs.host_candidate_path }}
          HOST_CANDIDATE_TREE: ${{ inputs.host_candidate_tree }}
          HOST_SOURCE_COMMIT: ${{ inputs.host_source_commit }}
          HOST_TAKOFORM_SOURCE_COMMIT: ${{ inputs.host_takoform_source_commit }}
          HOST_RUN_ID: ${{ inputs.host_run_id }}
          HOST_REQUEST_ID: ${{ inputs.host_request_id }}
          HOST_RUN_ATTEMPT: ${{ inputs.host_run_attempt }}
          HOST_HEAD_SHA: ${{ inputs.host_head_sha }}
          HOST_MANIFEST_DIGEST: ${{ inputs.host_manifest_digest }}
          HOST_SIGNED_MANIFEST_DIGEST: ${{ inputs.host_signed_manifest_digest }}
          PROVIDER_CANDIDATE_PATH: ${{ inputs.provider_candidate_path }}
          PROVIDER_CANDIDATE_TREE: ${{ inputs.provider_candidate_tree }}
          PROVIDER_SOURCE_COMMIT: ${{ inputs.provider_source_commit }}
          PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
          PROVIDER_REQUEST_ID: ${{ inputs.provider_request_id }}
          PROVIDER_RUN_ATTEMPT: ${{ inputs.provider_run_attempt }}
          PROVIDER_HEAD_SHA: ${{ inputs.provider_head_sha }}
          PROVIDER_MANIFEST_DIGEST: ${{ inputs.provider_manifest_digest }}
          PROVIDER_SIGNED_MANIFEST_DIGEST: ${{ inputs.provider_signed_manifest_digest }}
          REGISTRY_CANDIDATE_PATH: ${{ inputs.registry_candidate_path }}
          REGISTRY_CANDIDATE_TREE: ${{ inputs.registry_candidate_tree }}
          REGISTRY_RUN_ID: ${{ inputs.registry_run_id }}
          REGISTRY_REQUEST_ID: ${{ inputs.registry_request_id }}
          REGISTRY_RUN_ATTEMPT: ${{ inputs.registry_run_attempt }}
          REGISTRY_HEAD_SHA: ${{ inputs.registry_head_sha }}
          REGISTRY_MANIFEST_DIGEST: ${{ inputs.registry_manifest_digest }}
          REGISTRY_SIGNED_MANIFEST_DIGEST: ${{ inputs.registry_signed_manifest_digest }}
          ADMISSION_VERSION: ${{ inputs.admission_version }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_REF}" = "refs/heads/main"
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be a canonical lowercase UUIDv4" >&2
            exit 1
          fi
          test "${GITHUB_WORKFLOW}" = "Build signed Standard Form admission evidence"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "${GITHUB_SHA}" = "${current_main}"
          if ! git cat-file -e "${current_main}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${current_main}"
          fi
          [[ "${SNAPSHOT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SNAPSHOT_TREE}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SNAPSHOT_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${SNAPSHOT_TREE}"
          git merge-base --is-ancestor "${SNAPSHOT_COMMIT}" "${current_main}"
          [[ "${HOST_CANDIDATE_PATH}" =~ ^admission/v4/candidates/host-report-[0-9A-Za-z.-]+-[0-9a-f]{12}-[0-9a-f]{12}$ ]]
          [[ "${PROVIDER_CANDIDATE_PATH}" =~ ^admission/v4/candidates/provider-report-[0-9A-Za-z.-]+-[0-9a-f]{12}$ ]]
          [[ "${REGISTRY_CANDIDATE_PATH}" =~ ^admission/v4/candidates/registry-readback-[0-9A-Za-z.-]+-[0-9a-f]{12}$ ]]
          [[ "${HOST_CANDIDATE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PROVIDER_CANDIDATE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REGISTRY_CANDIDATE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "${SNAPSHOT_COMMIT}:${HOST_CANDIDATE_PATH}")" = "${HOST_CANDIDATE_TREE}"
          test "$(git rev-parse "${SNAPSHOT_COMMIT}:${PROVIDER_CANDIDATE_PATH}")" = "${PROVIDER_CANDIDATE_TREE}"
          test "$(git rev-parse "${SNAPSHOT_COMMIT}:${REGISTRY_CANDIDATE_PATH}")" = "${REGISTRY_CANDIDATE_TREE}"
          test "$(git cat-file -t "${HOST_CANDIDATE_TREE}")" = tree
          test "$(git cat-file -t "${PROVIDER_CANDIDATE_TREE}")" = tree
          test "$(git cat-file -t "${REGISTRY_CANDIDATE_TREE}")" = tree
          for commit in "${HOST_SOURCE_COMMIT}" "${HOST_TAKOFORM_SOURCE_COMMIT}" "${PROVIDER_SOURCE_COMMIT}"; do
            [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "${HOST_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${HOST_REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${HOST_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${HOST_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${HOST_HEAD_SHA}" = "${HOST_SOURCE_COMMIT}"
          [[ "${PROVIDER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PROVIDER_REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${PROVIDER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PROVIDER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${PROVIDER_HEAD_SHA}" = "${PROVIDER_SOURCE_COMMIT}"
          [[ "${REGISTRY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REGISTRY_REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${REGISTRY_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REGISTRY_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${REGISTRY_HEAD_SHA}" = "${PROVIDER_SOURCE_COMMIT}"
          for digest in "${HOST_MANIFEST_DIGEST}" "${HOST_SIGNED_MANIFEST_DIGEST}" "${PROVIDER_MANIFEST_DIGEST}" "${PROVIDER_SIGNED_MANIFEST_DIGEST}" "${REGISTRY_MANIFEST_DIGEST}" "${REGISTRY_SIGNED_MANIFEST_DIGEST}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "${ADMISSION_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          descriptor_version="$(jq -er '.version' admission/v4/version.json)"
          descriptor_tag="$(jq -er '.tag' admission/v4/version.json)"
          test "${ADMISSION_VERSION}" = "${descriptor_version}"
          test "${descriptor_tag}" = "forms/admissions/v${descriptor_version}"
          test "$(jq -er '.generation' admission/v4/version.json)" = "ga-core-v2"
          test "$(jq -er '.retainedRoot' admission/v4/version.json)" = "admission/v4"
          test "${HOST_CANDIDATE_PATH}" = "admission/v4/candidates/host-report-${ADMISSION_VERSION}-${HOST_SOURCE_COMMIT:0:12}-${HOST_TAKOFORM_SOURCE_COMMIT:0:12}"
          test "${PROVIDER_CANDIDATE_PATH}" = "admission/v4/candidates/provider-report-${ADMISSION_VERSION}-${PROVIDER_SOURCE_COMMIT:0:12}"
          test "${REGISTRY_CANDIDATE_PATH}" = "admission/v4/candidates/registry-readback-${ADMISSION_VERSION}-${PROVIDER_SOURCE_COMMIT:0:12}"
          test "$(git rev-parse "${HOST_TAKOFORM_SOURCE_COMMIT}^{commit}")" = "${HOST_TAKOFORM_SOURCE_COMMIT}"
          test "$(git rev-parse "${PROVIDER_SOURCE_COMMIT}^{commit}")" = "${PROVIDER_SOURCE_COMMIT}"
          git merge-base --is-ancestor "${HOST_TAKOFORM_SOURCE_COMMIT}" "${SNAPSHOT_COMMIT}"
          git merge-base --is-ancestor "${PROVIDER_SOURCE_COMMIT}" "${SNAPSHOT_COMMIT}"
          test "$(jq -er '.source.commit' "${HOST_CANDIDATE_PATH}/host-report-manifest.json")" = "${HOST_SOURCE_COMMIT}"
          test "$(jq -er '.takoformSource.commit' "${HOST_CANDIDATE_PATH}/host-report-manifest.json")" = "${HOST_TAKOFORM_SOURCE_COMMIT}"
          test "$(jq -er '.requestId' "${HOST_CANDIDATE_PATH}/signed-host-report-candidate.json")" = "${HOST_REQUEST_ID}"
          test "$(jq -er '.workflowRunId' "${HOST_CANDIDATE_PATH}/signed-host-report-candidate.json")" = "${HOST_RUN_ID}"
          test "$(jq -er '.workflowRunAttempt | tostring' "${HOST_CANDIDATE_PATH}/signed-host-report-candidate.json")" = "${HOST_RUN_ATTEMPT}"
          test "$(jq -er '.source.commit' "${HOST_CANDIDATE_PATH}/signed-host-report-candidate.json")" = "${HOST_HEAD_SHA}"
          test "$(jq -er '.source.commit' "${PROVIDER_CANDIDATE_PATH}/provider-report-manifest.json")" = "${PROVIDER_SOURCE_COMMIT}"
          test "$(jq -er '.requestId' "${PROVIDER_CANDIDATE_PATH}/signed-provider-report-candidate.json")" = "${PROVIDER_REQUEST_ID}"
          test "$(jq -er '.workflowRunId' "${PROVIDER_CANDIDATE_PATH}/signed-provider-report-candidate.json")" = "${PROVIDER_RUN_ID}"
          test "$(jq -er '.workflowRunAttempt | tostring' "${PROVIDER_CANDIDATE_PATH}/signed-provider-report-candidate.json")" = "${PROVIDER_RUN_ATTEMPT}"
          test "$(jq -er '.headSha' "${PROVIDER_CANDIDATE_PATH}/signed-provider-report-candidate.json")" = "${PROVIDER_HEAD_SHA}"
          test "$(jq -er '.source.commit' "${REGISTRY_CANDIDATE_PATH}/provider-registry-readback-manifest.json")" = "${PROVIDER_SOURCE_COMMIT}"
          test "$(jq -er '.requestId' "${REGISTRY_CANDIDATE_PATH}/signed-provider-registry-readback-candidate.json")" = "${REGISTRY_REQUEST_ID}"
          test "$(jq -er '.workflowRunId' "${REGISTRY_CANDIDATE_PATH}/signed-provider-registry-readback-candidate.json")" = "${REGISTRY_RUN_ID}"
          test "$(jq -er '.workflowRunAttempt | tostring' "${REGISTRY_CANDIDATE_PATH}/signed-provider-registry-readback-candidate.json")" = "${REGISTRY_RUN_ATTEMPT}"
          test "$(jq -er '.source.commit' "${REGISTRY_CANDIDATE_PATH}/signed-provider-registry-readback-candidate.json")" = "${REGISTRY_HEAD_SHA}"
          test "sha256:$(sha256sum "${HOST_CANDIDATE_PATH}/host-report-manifest.json" | cut -d ' ' -f 1)" = "${HOST_MANIFEST_DIGEST}"
          test "sha256:$(sha256sum "${HOST_CANDIDATE_PATH}/signed-host-report-candidate.json" | cut -d ' ' -f 1)" = "${HOST_SIGNED_MANIFEST_DIGEST}"
          test "sha256:$(sha256sum "${PROVIDER_CANDIDATE_PATH}/provider-report-manifest.json" | cut -d ' ' -f 1)" = "${PROVIDER_MANIFEST_DIGEST}"
          test "sha256:$(sha256sum "${PROVIDER_CANDIDATE_PATH}/signed-provider-report-candidate.json" | cut -d ' ' -f 1)" = "${PROVIDER_SIGNED_MANIFEST_DIGEST}"
          test "sha256:$(sha256sum "${REGISTRY_CANDIDATE_PATH}/provider-registry-readback-manifest.json" | cut -d ' ' -f 1)" = "${REGISTRY_MANIFEST_DIGEST}"
          test "sha256:$(sha256sum "${REGISTRY_CANDIDATE_PATH}/signed-provider-registry-readback-candidate.json" | cut -d ' ' -f 1)" = "${REGISTRY_SIGNED_MANIFEST_DIGEST}"
          {
            echo "source_commit=${SNAPSHOT_COMMIT}"
            echo "source_commit_short=${SNAPSHOT_COMMIT:0:12}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "HOST_CANDIDATE_PATH=${HOST_CANDIDATE_PATH}"
            echo "PROVIDER_CANDIDATE_PATH=${PROVIDER_CANDIDATE_PATH}"
            echo "REGISTRY_CANDIDATE_PATH=${REGISTRY_CANDIDATE_PATH}"
            echo "HOST_SOURCE_COMMIT=${HOST_SOURCE_COMMIT}"
            echo "HOST_TAKOFORM_SOURCE_COMMIT=${HOST_TAKOFORM_SOURCE_COMMIT}"
            echo "PROVIDER_SOURCE_COMMIT=${PROVIDER_SOURCE_COMMIT}"
            echo "HOST_RUN_ID=${HOST_RUN_ID}"
            echo "HOST_REQUEST_ID=${HOST_REQUEST_ID}"
            echo "HOST_RUN_ATTEMPT=${HOST_RUN_ATTEMPT}"
            echo "HOST_HEAD_SHA=${HOST_HEAD_SHA}"
            echo "PROVIDER_RUN_ID=${PROVIDER_RUN_ID}"
            echo "PROVIDER_REQUEST_ID=${PROVIDER_REQUEST_ID}"
            echo "PROVIDER_RUN_ATTEMPT=${PROVIDER_RUN_ATTEMPT}"
            echo "PROVIDER_HEAD_SHA=${PROVIDER_HEAD_SHA}"
            echo "REGISTRY_RUN_ID=${REGISTRY_RUN_ID}"
            echo "REGISTRY_REQUEST_ID=${REGISTRY_REQUEST_ID}"
            echo "REGISTRY_RUN_ATTEMPT=${REGISTRY_RUN_ATTEMPT}"
            echo "REGISTRY_HEAD_SHA=${REGISTRY_HEAD_SHA}"
          } >> "${GITHUB_ENV}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Offline-verify every exact retained report before generation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "${EXPECTED_COSIGN_VERSION}" <<<"$(cosign version 2>&1)"
          host_report_identity="$(jq -er --arg id "${HOST_ID}" \
            '.hosts[] | select(.hostId == $id) | .certificateIdentity' \
            admission/v4/conforming-hosts.json)"
          test "$(find "${HOST_CANDIDATE_PATH}" -type l | wc -l)" -eq 0
          test "$(find "${PROVIDER_CANDIDATE_PATH}" -type l | wc -l)" -eq 0
          test "$(find "${REGISTRY_CANDIDATE_PATH}" -type l | wc -l)" -eq 0
          test "$(find "${HOST_CANDIDATE_PATH}" -type f | wc -l)" -eq 26
          test "$(find "${PROVIDER_CANDIDATE_PATH}" -type f | wc -l)" -eq 71
          test "$(find "${REGISTRY_CANDIDATE_PATH}" -type f | wc -l)" -eq 6
          mapfile -t host_reports < <(find "${HOST_CANDIDATE_PATH}/packages" -mindepth 2 -maxdepth 2 -type f -name host-report.json | sort)
          mapfile -t provider_reports < <(find "${PROVIDER_CANDIDATE_PATH}/packages" -mindepth 2 -maxdepth 2 -type f -name provider-report.json | sort)
          test "${#host_reports[@]}" -eq 10
          test "${#provider_reports[@]}" -eq 34
          for report in "${host_reports[@]}"; do
            cosign verify-blob "${report}" --bundle "${report%.json}.sigstore.json" \
              --trusted-root admission/v4/trust/trusted-root.json \
              --certificate-identity "${host_report_identity}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}"
          done
          cosign verify-blob "${HOST_CANDIDATE_PATH}/portable-host-runner-report.json" \
            --bundle "${HOST_CANDIDATE_PATH}/portable-host-runner-report.sigstore.json" \
            --trusted-root admission/v4/trust/trusted-root.json \
            --certificate-identity "${host_report_identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}"
          cosign verify-blob "${HOST_CANDIDATE_PATH}/SHA256SUMS" \
            --bundle "${HOST_CANDIDATE_PATH}/SHA256SUMS.sigstore.json" \
            --trusted-root admission/v4/trust/trusted-root.json \
            --certificate-identity "${host_report_identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}"
          for report in "${provider_reports[@]}"; do
            cosign verify-blob "${report}" --bundle "${report%.json}.sigstore.json" \
              --trusted-root admission/v4/trust/trusted-root.json \
              --certificate-identity "${PROVIDER_REPORT_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}"
          done
          cosign verify-blob "${REGISTRY_CANDIDATE_PATH}/provider-readback.json" \
            --bundle "${REGISTRY_CANDIDATE_PATH}/provider-readback.sigstore.json" \
            --trusted-root admission/v4/trust/trusted-root.json \
            --certificate-identity "${REGISTRY_READBACK_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}"

      - name: Build the exact material twice
        shell: bash
        env:
          ADMISSION_VERSION: ${{ inputs.admission_version }}
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/material-first"
          second="${RUNNER_TEMP}/material-second"
          go run ./cmd/standard-admission-material build-current \
            --host-id "${HOST_ID}" \
            --host-reports "${HOST_CANDIDATE_PATH}" \
            --provider-reports "${PROVIDER_CANDIDATE_PATH}" \
            --registry-readback "${REGISTRY_CANDIDATE_PATH}" \
            --output-dir "${first}" \
            --admission-version "${ADMISSION_VERSION}" \
            --host-source-commit "${HOST_SOURCE_COMMIT}" \
            --host-takoform-source-commit "${HOST_TAKOFORM_SOURCE_COMMIT}" \
            --provider-source-commit "${PROVIDER_SOURCE_COMMIT}" \
            --host-request-id "${HOST_REQUEST_ID}" \
            --host-run-id "${HOST_RUN_ID}" \
            --host-run-attempt "${HOST_RUN_ATTEMPT}" \
            --host-head-sha "${HOST_HEAD_SHA}" \
            --provider-request-id "${PROVIDER_REQUEST_ID}" \
            --provider-run-id "${PROVIDER_RUN_ID}" \
            --provider-run-attempt "${PROVIDER_RUN_ATTEMPT}" \
            --provider-head-sha "${PROVIDER_HEAD_SHA}" \
            --registry-request-id "${REGISTRY_REQUEST_ID}" \
            --registry-run-id "${REGISTRY_RUN_ID}" \
            --registry-run-attempt "${REGISTRY_RUN_ATTEMPT}" \
            --registry-head-sha "${REGISTRY_HEAD_SHA}"
          go run ./cmd/standard-admission-material build-current \
            --host-id "${HOST_ID}" \
            --host-reports "${HOST_CANDIDATE_PATH}" \
            --provider-reports "${PROVIDER_CANDIDATE_PATH}" \
            --registry-readback "${REGISTRY_CANDIDATE_PATH}" \
            --output-dir "${second}" \
            --admission-version "${ADMISSION_VERSION}" \
            --host-source-commit "${HOST_SOURCE_COMMIT}" \
            --host-takoform-source-commit "${HOST_TAKOFORM_SOURCE_COMMIT}" \
            --provider-source-commit "${PROVIDER_SOURCE_COMMIT}" \
            --host-request-id "${HOST_REQUEST_ID}" \
            --host-run-id "${HOST_RUN_ID}" \
            --host-run-attempt "${HOST_RUN_ATTEMPT}" \
            --host-head-sha "${HOST_HEAD_SHA}" \
            --provider-request-id "${PROVIDER_REQUEST_ID}" \
            --provider-run-id "${PROVIDER_RUN_ID}" \
            --provider-run-attempt "${PROVIDER_RUN_ATTEMPT}" \
            --provider-head-sha "${PROVIDER_HEAD_SHA}" \
            --registry-request-id "${REGISTRY_REQUEST_ID}" \
            --registry-run-id "${REGISTRY_RUN_ID}" \
            --registry-run-attempt "${REGISTRY_RUN_ATTEMPT}" \
            --registry-head-sha "${REGISTRY_HEAD_SHA}"
          diff -ru "${first}" "${second}"
          test "$(find "${first}" -type f | wc -l)" -eq 105
          test "$(find "${first}" -type l | wc -l)" -eq 0

      - name: Close the unsigned handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/admission-evidence-handoff"
          mkdir "${handoff}"
          cp -a "${HOST_CANDIDATE_PATH}" "${handoff}/host"
          cp -a "${PROVIDER_CANDIDATE_PATH}" "${handoff}/provider"
          cp -a "${REGISTRY_CANDIDATE_PATH}" "${handoff}/registry"
          cp -a "${RUNNER_TEMP}/material-first" "${handoff}/material"
          test "$(find "${handoff}" -type l | wc -l)" -eq 0
          (
            cd "${handoff}"
            find host provider registry material -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > HANDOFF_SHA256SUMS
            sha256sum --check --strict HANDOFF_SHA256SUMS
          )

      - name: Upload the unsigned same-run handoff
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-admission-evidence-handoff-${{ steps.source.outputs.source_commit }}
          path: ${{ runner.temp }}/admission-evidence-handoff/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign only the exact evidence subjects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: assemble
    environment: standard-admission-evidence
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Reject an incomplete same-run artifact binding
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          test "${GITHUB_RUN_ATTEMPT}" = "1"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ${{ runner.temp }}/handoff
          digest-mismatch: error

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Verify the handoff and sign only ten evidence files
        shell: bash
        run: |
          set -euo pipefail
          grep -F "${EXPECTED_COSIGN_VERSION}" <<<"$(cosign version 2>&1)"
          test "$(find "${RUNNER_TEMP}/handoff" -type l | wc -l)" -eq 0
          (
            cd "${RUNNER_TEMP}/handoff"
            sha256sum --check --strict HANDOFF_SHA256SUMS
          )
          mapfile -t evidence < <(find "${RUNNER_TEMP}/handoff/material/packages" -mindepth 2 -maxdepth 2 -type f -name evidence.json | sort)
          test "${#evidence[@]}" -eq 10
          for subject in "${evidence[@]}"; do
            bundle="${subject%.json}.sigstore.json"
            test ! -e "${bundle}"
            cosign sign-blob "${subject}" --bundle "${bundle}" --yes
            cosign verify-blob "${subject}" --bundle "${bundle}" \
              --certificate-identity "${EVIDENCE_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}"
          done
          test "$(find "${RUNNER_TEMP}/handoff/material" -type f | wc -l)" -eq 115

      - name: Upload the closed signed candidate without publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-admission-evidence-candidate-${{ inputs.admission_version }}-${{ needs.assemble.outputs.source_commit_short }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/handoff/material/
          if-no-files-found: error
          retention-days: 90

      - name: Record the non-publication boundary
        shell: bash
        env:
          ADMISSION_VERSION: ${{ inputs.admission_version }}
        run: |
          {
            echo "### Standard Form admission evidence candidate"
            echo ""
            echo "- source: \`${{ needs.assemble.outputs.source_commit }}\`"
            echo "- admission version: \`${ADMISSION_VERSION}\`"
            echo "- request id: \`${{ inputs.request_id }}\`"
            echo "- signed evidence subjects: 10"
            echo "- release, tag, registry, contents write, or production mutation: none"
          } >> "${GITHUB_STEP_SUMMARY}"
