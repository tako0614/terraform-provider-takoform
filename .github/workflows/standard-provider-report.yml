name: Build signed standard provider reports

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact owner-dispatch UUIDv4 correlation token
        required: true
        type: string

run-name: ${{ inputs.request_id }}

concurrency:
  group: standard-provider-report-${{ github.sha }}-${{ inputs.request_id }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"
  REPORT_IDENTITY: https://github.com/tako0614/terraform-provider-takoform/.github/workflows/standard-provider-report.yml@refs/heads/main

jobs:
  generate:
    name: Execute the provider and close the current unsigned report set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_commit_short: ${{ steps.source.outputs.source_commit_short }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind this exact run attempt to protected main
        id: source
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be a canonical lowercase UUIDv4" >&2
            exit 1
          fi
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "source_commit_short=${GITHUB_SHA:0:12}"
            echo "artifact_name=takoform-standard-provider-report-unsigned-current-${REQUEST_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Execute exact candidate fixtures without signing authority
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test ./internal/providerreport ./internal/admissionrelease
          output="${RUNNER_TEMP}/provider-report-candidate"
          go run ./cmd/provider-lifecycle-conformance provider-reports \
            --cli tofu --output-dir "${output}" --source-commit "${GITHUB_SHA}"
          go run ./cmd/provider-lifecycle-conformance verify-provider-reports \
            --input-dir "${output}" --source-commit "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the exact unsigned closure
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/provider-report-candidate/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Authenticate the exact report subjects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate
    environment: standard-provider-report
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.generate.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reject an incomplete same-run artifact binding
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.generate.outputs.artifact_digest }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be a canonical lowercase UUIDv4" >&2
            exit 1
          fi
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "${SOURCE_COMMIT}" = "${GITHUB_SHA}"

      - name: Download only the immutable artifact id from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: unsigned
          digest-mismatch: error

      - name: Revalidate canonical inventory and every current subject
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const root = "unsigned";
          const digest = (raw) => `sha256:${crypto.createHash("sha256").update(raw).digest("hex")}`;
          const canonicalValue = (value) => Array.isArray(value) ? value.map(canonicalValue) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalValue(value[key])])) : value;
          const canonical = (value) => Buffer.from(JSON.stringify(canonicalValue(value)));
          const same = (left, right) => canonical(left).equals(canonical(right));
          const readCanonical = (name) => { const raw = fs.readFileSync(path.join(root, name)); const value = JSON.parse(raw); if (!raw.equals(canonical(value))) throw new Error(`${name} is not exact canonical JSON`); return {raw, value}; };
          // The expected closure is derived from the reviewed inventory and
          // release descriptor, so a Form added to the catalogue is covered
          // here without a second hand-maintained list to fall out of step.
          const inventory = JSON.parse(fs.readFileSync("forms/standard-package-set.json"));
          const descriptor = JSON.parse(fs.readFileSync("release/version.json"));
          const expected = new Map(inventory.packages.map((entry) => {
            const slug = entry.path.split("/").pop();
            const definition = JSON.parse(fs.readFileSync(`${entry.path}/definition.json`));
            return [slug, {
              kind:entry.kind,
              version:entry.formRef.definitionVersion,
              schemaDigest:entry.formRef.schemaDigest,
              packageDigest:entry.packageDigest,
              positive:definition.conformanceFixtures.map((fixture) => fixture.name),
              negative:definition.negativeConformanceFixtures.map((fixture) => fixture.name),
            }];
          }));
          const {value: manifest} = readCanonical("provider-report-manifest.json");
          if (manifest.format !== "takoform.standard-provider-report-candidate@v1" || manifest.status !== "candidate-only" || manifest.proofType !== "provider" || manifest.subject !== "provider:registry.terraform.io/tako0614/takoform" || manifest.generation !== inventory.generation || manifest.runnerVersion !== descriptor.version || manifest.source?.repository !== "https://github.com/tako0614/terraform-provider-takoform.git" || manifest.source?.commit !== process.env.SOURCE_COMMIT || manifest.reports?.length !== expected.size) throw new Error("provider-report manifest identity drift");
          const files = ["provider-report-manifest.json"];
          const seen = new Set();
          let providerBinarySha256 = "";
          for (const entry of manifest.reports) {
            const want = expected.get(entry.slug);
            if (!want || seen.has(entry.slug) || entry.kind !== want.kind || entry.path !== `packages/${entry.slug}/provider-report.json` || entry.bundlePath !== `packages/${entry.slug}/provider-report.sigstore.json`) throw new Error("report descriptor closure drift");
            seen.add(entry.slug);
            const {raw, value: report} = readCanonical(entry.path);
            const identity = {formRef:{apiVersion:"forms.takoform.com/v1alpha1",kind:want.kind,definitionVersion:want.version,schemaDigest:want.schemaDigest},packageDigest:want.packageDigest};
            if (entry.digest !== digest(raw) || !same(entry.identity, identity) || report.format !== "takoform.standard-provider-runner-report@v2" || report.role !== "provider-report" || report.status !== "passed" || report.subject !== manifest.subject || report.runnerVersion !== manifest.runnerVersion || !same(report.identity, identity)) throw new Error(`${entry.slug} identity or digest drift`);
            const lifecycleKeys = ["create","delete","drift","import","observe","read","refresh","update"];
            const reportKeys = ["format","identity","lifecycle","negativeFixtures","positiveFixtures","providerBinarySha256","role","runnerVersion","status","subject"];
            const positive = want.positive.map((name) => ({name,passed:true}));
            const negative = want.negative.map((name) => ({errorCode:"invalid_argument",name,passed:true}));
            if (!same(Object.keys(report).sort(), reportKeys) || !/^sha256:[0-9a-f]{64}$/.test(report.providerBinarySha256) || !same(Object.keys(report.lifecycle ?? {}).sort(), lifecycleKeys) || !Object.values(report.lifecycle ?? {}).every((value) => value === true) || !same(report.positiveFixtures,positive) || !same(report.negativeFixtures,negative)) throw new Error(`${entry.slug} proof closure drift`);
            if (providerBinarySha256 && report.providerBinarySha256 !== providerBinarySha256) throw new Error(`${entry.slug} used a different provider binary`);
            providerBinarySha256 = report.providerBinarySha256;
            files.push(entry.path);
          }
          if (seen.size !== expected.size) throw new Error("report set incomplete");
          const actual = [];
          const walk = (dir) => { for (const name of fs.readdirSync(dir)) { const full = path.join(dir, name); const stat = fs.lstatSync(full); if (stat.isSymbolicLink()) throw new Error(`symlink ${full}`); if (stat.isDirectory()) walk(full); else if (stat.isFile() && stat.size <= 16 * 1024 * 1024) actual.push(path.relative(root, full).split(path.sep).join("/")); else throw new Error(`invalid file ${full}`); } };
          walk(root);
          if (JSON.stringify(actual.sort()) !== JSON.stringify(files.sort())) throw new Error("unsigned artifact contains missing or extra files");
          NODE

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Sign each exact report and build the signed handoff
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.generate.outputs.artifact_digest }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
        run: |
          set -euo pipefail
          grep -F "${EXPECTED_COSIGN_VERSION}" <<<"$(cosign version 2>&1)"
          while IFS= read -r report; do
            bundle="${report%.json}.sigstore.json"
            cosign sign-blob "unsigned/${report}" --bundle "unsigned/${bundle}" --yes
            cosign verify-blob "unsigned/${report}" --bundle "unsigned/${bundle}" \
              --certificate-identity "${REPORT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done < <(node -e 'const m=require("./unsigned/provider-report-manifest.json"); for (const r of m.reports) console.log(r.path)')
          ARTIFACT_ID="${ARTIFACT_ID}" ARTIFACT_DIGEST="${ARTIFACT_DIGEST}" SOURCE_COMMIT="${SOURCE_COMMIT}" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const root = "unsigned";
          const digest = (raw) => `sha256:${crypto.createHash("sha256").update(raw).digest("hex")}`;
          const sorted = (value) => Array.isArray(value) ? value.map(sorted) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sorted(value[key])])) : value;
          const manifestRaw = fs.readFileSync(path.join(root, "provider-report-manifest.json"));
          const manifest = JSON.parse(manifestRaw);
          const reports = manifest.reports.map((entry) => {
            const bundlePath = entry.bundlePath;
            return {kind:entry.kind,slug:entry.slug,reportPath:entry.path,reportDigest:entry.digest,bundlePath,bundleDigest:digest(fs.readFileSync(path.join(root,bundlePath)))};
          });
          const candidate = {
            format:"takoform.standard-provider-report-signed-candidate@v1", status:"candidate-only", proofType:"provider",
            generation:manifest.generation,
            subject:manifest.subject, certificateIdentity:process.env.REPORT_IDENTITY,
            workflow:".github/workflows/standard-provider-report.yml",
            requestId:process.env.REQUEST_ID,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha:process.env.GITHUB_SHA,
            source:manifest.source,
            manifest:{path:"provider-report-manifest.json",digest:digest(manifestRaw)}, entries:reports,
          };
          fs.writeFileSync(path.join(root,"signed-provider-report-candidate.json"), JSON.stringify(sorted(candidate)));
          const files = ["provider-report-manifest.json","signed-provider-report-candidate.json",...reports.flatMap((r) => [r.reportPath,r.bundlePath])].sort();
          fs.writeFileSync(path.join(root,"SHA256SUMS"), files.map((name) => `${digest(fs.readFileSync(path.join(root,name))).slice(7)}  ${name}`).join("\n")+"\n");
          NODE
          (cd unsigned && sha256sum --check --strict SHA256SUMS)

      - name: Upload the signed provider-report candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takoform-standard-provider-report-candidate-current-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.generate.outputs.source_commit_short }}
          path: unsigned/
          if-no-files-found: error
          retention-days: 90
