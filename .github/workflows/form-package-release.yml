name: Prepare signed Form Package release candidate
run-name: ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact owner-deploy UUIDv4 dispatch correlation token
        required: true
        type: string
      tag:
        description: Exact planned forms/k-<base32-kind>/v<semver> tag to prepare
        required: true
        type: string
      expected_commit:
        description: Exact approved 40-character package source commit
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: form-package-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: form-package-release
    steps:
      - name: Check out the trusted main workflow and release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main and the exact approved source commit
        id: source
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be a canonical lowercase UUIDv4" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Candidate preparation must execute the current protected main tooling commit" >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/form-package-release.yml@refs/heads/main" ]]; then
            echo "Candidate preparation must use the protected main workflow identity" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^forms/k-[a-z2-7]{2,103}/v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Form Package candidates require an exact base32 release-id tag" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be an exact lowercase 40-character Git commit" >&2
            exit 1
          fi
          git cat-file -e "$EXPECTED_COMMIT^{commit}"
          git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Local checkout already contains $RELEASE_TAG; refusing a pre-existing identity" >&2
            exit 1
          fi
          remote_tag_refs="$RUNNER_TEMP/form-package-release-remote-tag-refs.txt"
          if ! git ls-remote --tags origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > "$remote_tag_refs"; then
            echo "Could not prove remote tag absence for $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -s "$remote_tag_refs" ]]; then
            echo "Remote tag $RELEASE_TAG already exists; refusing overwrite" >&2
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$EXPECTED_COMMIT"
            echo "tooling_commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the untrusted package source by exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install pinned Cosign v3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Validate the canonical plan and create an ephemeral tag object
        id: tag_object
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-source rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git -C release-source status --porcelain=v1 --untracked-files=all)"
          if git -C release-source show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Exact source checkout unexpectedly contains $RELEASE_TAG" >&2
            exit 1
          fi

          trusted_conformance="$RUNNER_TEMP/standard-form-conformance"
          go build -o "$trusted_conformance" ./cmd/standard-form-conformance
          (
            cd release-source
            "$trusted_conformance" release-plan > "$RUNNER_TEMP/form-package-release-plan.txt"
          )
          jq -e --arg tag "$RELEASE_TAG" '
            .format == "takoform.release-plan@v1"
            and .repository == "tako0614/terraform-provider-takoform"
            and ([.releases[] | select(.tag == $tag)] | length == 1)
          ' release-source/forms/release-plan.json > /dev/null

          tag_object="$RUNNER_TEMP/form-package-tag-object"
          tagger_epoch="$(git -C release-source show -s --format=%ct "$EXPECTED_COMMIT")"
          workflow_run="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          {
            printf 'object %s\n' "$EXPECTED_COMMIT"
            printf 'type commit\n'
            printf 'tag %s\n' "$RELEASE_TAG"
            printf 'tagger Takoform Form Package Release <release@takoform.invalid> %s +0000\n\n' "$tagger_epoch"
            printf 'Takoform Form Package %s\n\n' "$RELEASE_TAG"
            printf 'source-commit: %s\n' "$EXPECTED_COMMIT"
            printf 'request-id: %s\n' "$REQUEST_ID"
            printf 'workflow-run: %s\n' "$workflow_run"
          } > "$tag_object"
          tag_object_oid="$(git -C release-source mktag < "$tag_object")"
          git -C release-source update-ref "refs/tags/$RELEASE_TAG" "$tag_object_oid"
          test "$(git -C release-source cat-file -t "$tag_object_oid")" = "tag"
          test "$(git -C release-source rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"
          git -C release-source cat-file tag "$tag_object_oid" > "$RUNNER_TEMP/materialized-tag-object"
          cmp "$tag_object" "$RUNNER_TEMP/materialized-tag-object"
          test -z "$(git -C release-source status --porcelain=v1 --untracked-files=all)"

          object_format="$(git -C release-source rev-parse --show-object-format)"
          tag_object_sha256="sha256:$(sha256sum "$tag_object" | cut -d' ' -f1)"
          {
            echo "object_format=$object_format"
            echo "oid=$tag_object_oid"
            echo "sha256=$tag_object_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          github_releases_control="$RUNNER_TEMP/form-package-release-capability-control.json"
          if ! github_repository_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$github_releases_control" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=1")"; then
            echo "Could not prove GitHub Release read capability" >&2
            exit 1
          fi
          if [[ "$github_repository_status" != "200" ]]; then
            echo "GitHub Release capability control expected 200, got $github_repository_status" >&2
            exit 1
          fi
          jq -e 'type == "array"' "$github_releases_control" >/dev/null
          encoded_release_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          github_release_body="$RUNNER_TEMP/form-package-release-preflight.json"
          if ! github_release_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$github_release_body" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_release_tag")"; then
            echo "Could not prove GitHub release absence for $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$github_release_status" == "200" ]]; then
            echo "A GitHub release already owns $RELEASE_TAG; refusing overwrite" >&2
            exit 1
          fi
          if [[ "$github_release_status" != "404" ]]; then
            echo "GitHub release absence preflight expected 404, got $github_release_status" >&2
            exit 1
          fi

      - name: Build deterministic public assets with trusted main tooling
        id: build
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          TOOLING_COMMIT: ${{ steps.source.outputs.tooling_commit }}
        run: |
          set -euo pipefail
          cosign_version="$(cosign version 2>&1)"
          grep -F "$EXPECTED_COSIGN_VERSION" <<<"$cosign_version"
          go test ./formpackage ./cmd/form-package-release
          go run ./cmd/standard-form-conformance materializability-check

          candidate="$RUNNER_TEMP/form-package-release-candidate"
          output="$candidate/assets"
          mkdir -p "$candidate"
          go run ./cmd/form-package-release build-package \
            --repo "$GITHUB_WORKSPACE/release-source" \
            --tag "$RELEASE_TAG" \
            --tooling-commit "$TOOLING_COMMIT" \
            --output "$output"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg source "$EXPECTED_COMMIT" \
            --arg tooling "$TOOLING_COMMIT" \
            '.tag == $tag
              and .sourceCommit == $source
              and .toolingCommit == $tooling
              and .workflow == ".github/workflows/form-package-release.yml"
              and .publicationReady == false
              and .publicationBlockers == []' \
            "$output/release-manifest.json" > /dev/null
          {
            echo "candidate=$candidate"
            echo "output=$output"
            echo "subject=$(jq -r .signedSubject "$output/release-manifest.json")"
            echo "bundle=$(jq -r .signatureBundle "$output/release-manifest.json")"
            echo "identity=$(jq -r .publisherPolicy.identity "$output/release-manifest.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Keyless-sign and finalize the exact seven public assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          TOOLING_COMMIT: ${{ steps.source.outputs.tooling_commit }}
          TAG_OBJECT_FORMAT: ${{ steps.tag_object.outputs.object_format }}
          TAG_OBJECT_OID: ${{ steps.tag_object.outputs.oid }}
          TAG_OBJECT_SHA256: ${{ steps.tag_object.outputs.sha256 }}
        run: |
          set -euo pipefail
          candidate="${{ steps.build.outputs.candidate }}"
          output="${{ steps.build.outputs.output }}"
          subject="$output/${{ steps.build.outputs.subject }}"
          bundle="$output/${{ steps.build.outputs.bundle }}"
          cosign sign-blob "$subject" --bundle "$bundle" --yes
          cosign verify-blob "$subject" \
            --bundle "$bundle" \
            --certificate-identity "${{ steps.build.outputs.identity }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          go run ./cmd/form-package-release finalize-bundle --output "$output"
          (
            cd "$output"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg source "$EXPECTED_COMMIT" \
            --arg tooling "$TOOLING_COMMIT" \
            '.tag == $tag
              and .sourceCommit == $source
              and .toolingCommit == $tooling
              and .publicationReady == true
              and .publicationBlockers == []
              and (.assets | length == 5)' \
            "$output/release-manifest.json" > /dev/null
          test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 7

          cp "$RUNNER_TEMP/form-package-tag-object" "$candidate/tag-object"
          asset_digests="$RUNNER_TEMP/form-package-asset-digests.json"
          (
            cd "$output"
            while IFS= read -r -d '' asset; do
              digest="$(sha256sum "$asset" | cut -d' ' -f1)"
              jq -n -S -c \
                --arg name "$asset" \
                --arg sha256 "sha256:$digest" \
                '{name:$name,sha256:$sha256}'
            done < <(find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z)
          ) | jq -s -c 'sort_by(.name)' > "$asset_digests"
          test "$(jq 'length' "$asset_digests")" -eq 7

          workflow_path=".github/workflows/form-package-release.yml"
          jq -n -S -c \
            --arg format "takoform.form-package-release-candidate@v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowPath "$workflow_path" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg sourceRef "$GITHUB_REF" \
            --arg requestId "${{ inputs.request_id }}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg tag "$RELEASE_TAG" \
            --arg sourceCommit "$EXPECTED_COMMIT" \
            --arg toolingCommit "$TOOLING_COMMIT" \
            --arg objectFormat "$TAG_OBJECT_FORMAT" \
            --arg tagObjectOid "$TAG_OBJECT_OID" \
            --arg tagObjectSha256 "$TAG_OBJECT_SHA256" \
            --slurpfile assets "$asset_digests" \
            '{format:$format,repository:$repository,workflowPath:$workflowPath,workflowRef:$workflowRef,sourceRef:$sourceRef,requestId:$requestId,runId:$runId,runAttempt:$runAttempt,tag:$tag,sourceCommit:$sourceCommit,toolingCommit:$toolingCommit,objectFormat:$objectFormat,tagObjectOid:$tagObjectOid,tagObjectSha256:$tagObjectSha256,assets:$assets[0]}' \
            > "$candidate/metadata.json"
          (
            cd "$candidate"
            {
              sha256sum metadata.json tag-object
              find assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            } > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 9
            find . -type f ! -path './SHA256SUMS' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/candidate-files.txt"
            awk '{print $2}' SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/checksummed-files.txt"
            diff -u "$RUNNER_TEMP/candidate-files.txt" "$RUNNER_TEMP/checksummed-files.txt"
            test -z "$(find . -type l -print -quit)"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload the closed candidate for operator publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: form-package-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/form-package-release-candidate
          if-no-files-found: error
          retention-days: 1
