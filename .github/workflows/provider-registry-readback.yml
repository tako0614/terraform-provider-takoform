name: Build signed provider Registry readback

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact owner-deploy UUIDv4 dispatch correlation token
        required: true
        type: string

run-name: ${{ inputs.request_id }}

concurrency:
  group: provider-registry-readback-${{ github.sha }}-${{ inputs.request_id }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"
  READBACK_IDENTITY: https://github.com/tako0614/terraform-provider-takoform/.github/workflows/provider-registry-readback.yml@refs/heads/main

jobs:
  generate:
    name: Install the published provider with both supported CLIs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_commit_short: ${{ steps.source.outputs.source_commit_short }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind this exact run attempt to protected main and the published tag
        id: source
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "request_id must be a canonical lowercase UUIDv4" >&2
            exit 1
          fi
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"
          version="$(node -p 'require("./release/version.json").version')"
          tag="v${version}"
          git rev-parse --verify "${tag}^{commit}" >/dev/null
          release_commit="$(git rev-list -n 1 "${tag}")"
          git merge-base --is-ancestor "${release_commit}" "${GITHUB_SHA}"
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "source_commit_short=${GITHUB_SHA:0:12}"
            echo "provider_version=${version}"
            echo "provider_tag=${tag}"
            echo "provider_release_commit=${release_commit}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # pinned: v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Execute and close the unsigned direct-Registry readback
        shell: bash
        env:
          PROVIDER_VERSION: ${{ steps.source.outputs.provider_version }}
          PROVIDER_TAG: ${{ steps.source.outputs.provider_tag }}
          PROVIDER_RELEASE_COMMIT: ${{ steps.source.outputs.provider_release_commit }}
        run: |
          set -euo pipefail
          go mod verify
          output="${RUNNER_TEMP}/registry-readback"
          mkdir "${output}"
          go run ./cmd/provider-lifecycle-conformance render-registry-matrix \
            --opentofu tofu --terraform terraform > "${output}/provider-lifecycle-matrix.json"
          go run ./cmd/provider-registry-readback \
            --matrix "${output}/provider-lifecycle-matrix.json" \
            --provider-release-commit "${PROVIDER_RELEASE_COMMIT}" \
            --output "${output}/provider-readback.json"
          OUTPUT="${output}" SOURCE_COMMIT="${GITHUB_SHA}" PROVIDER_VERSION="${PROVIDER_VERSION}" PROVIDER_TAG="${PROVIDER_TAG}" PROVIDER_RELEASE_COMMIT="${PROVIDER_RELEASE_COMMIT}" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const digest = (raw) => `sha256:${crypto.createHash("sha256").update(raw).digest("hex")}`;
          const sorted = (value) => Array.isArray(value) ? value.map(sorted) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sorted(value[key])])) : value;
          const root = process.env.OUTPUT;
          const matrix = fs.readFileSync(path.join(root, "provider-lifecycle-matrix.json"));
          const readback = fs.readFileSync(path.join(root, "provider-readback.json"));
          const manifest = {
            format:"takoform.provider-registry-readback-candidate@v1",
            status:"candidate-only",
            proofType:"registry-readback",
            generation:"portable-v1",
            source:{repository:"https://github.com/tako0614/terraform-provider-takoform.git",commit:process.env.SOURCE_COMMIT},
            provider:{address:"registry.terraform.io/tako0614/takoform",version:process.env.PROVIDER_VERSION,tag:process.env.PROVIDER_TAG,commit:process.env.PROVIDER_RELEASE_COMMIT},
            matrix:{path:"provider-lifecycle-matrix.json",digest:digest(matrix)},
            readback:{path:"provider-readback.json",digest:digest(readback),bundlePath:"provider-readback.sigstore.json"},
          };
          fs.writeFileSync(path.join(root, "provider-registry-readback-manifest.json"), JSON.stringify(sorted(manifest)));
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the exact unsigned closure
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takoform-provider-registry-readback-unsigned-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.source.outputs.source_commit_short }}
          path: ${{ runner.temp }}/registry-readback/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Authenticate only the canonical readback subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate
    environment: provider-registry-readback
    permissions:
      id-token: write
    steps:
      - name: Reject an incomplete same-run artifact binding
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.generate.outputs.artifact_digest }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "${REQUEST_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "${SOURCE_COMMIT}" = "${GITHUB_SHA}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: unsigned
          digest-mismatch: error

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Revalidate, sign, and close the candidate
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.generate.outputs.artifact_digest }}
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
        run: |
          set -euo pipefail
          grep -F "${EXPECTED_COSIGN_VERSION}" <<<"$(cosign version 2>&1)"
          test "$(find unsigned -type l | wc -l)" -eq 0
          test "$(find unsigned -type f | wc -l)" -eq 3
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const digest = (raw) => `sha256:${crypto.createHash("sha256").update(raw).digest("hex")}`;
          const sorted = (value) => Array.isArray(value) ? value.map(sorted) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sorted(value[key])])) : value;
          const raw = fs.readFileSync("unsigned/provider-registry-readback-manifest.json");
          const manifest = JSON.parse(raw);
          if (!raw.equals(Buffer.from(JSON.stringify(sorted(manifest)))) || manifest.format !== "takoform.provider-registry-readback-candidate@v1" || manifest.status !== "candidate-only" || manifest.proofType !== "registry-readback" || manifest.generation !== "portable-v1" || manifest.source?.commit !== process.env.SOURCE_COMMIT || manifest.provider?.address !== "registry.terraform.io/tako0614/takoform") throw new Error("registry-readback manifest identity drift");
          if (manifest.matrix.digest !== digest(fs.readFileSync(`unsigned/${manifest.matrix.path}`)) || manifest.readback.digest !== digest(fs.readFileSync(`unsigned/${manifest.readback.path}`))) throw new Error("registry-readback manifest digest drift");
          NODE
          cosign sign-blob unsigned/provider-readback.json --bundle unsigned/provider-readback.sigstore.json --yes
          cosign verify-blob unsigned/provider-readback.json --bundle unsigned/provider-readback.sigstore.json \
            --certificate-identity "${READBACK_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const digest = (raw) => `sha256:${crypto.createHash("sha256").update(raw).digest("hex")}`;
          const sorted = (value) => Array.isArray(value) ? value.map(sorted) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sorted(value[key])])) : value;
          const manifestRaw = fs.readFileSync("unsigned/provider-registry-readback-manifest.json");
          const manifest = JSON.parse(manifestRaw);
          const signed = {
            format:"takoform.provider-registry-readback-signed-candidate@v1",
            status:"candidate-only",
            proofType:"registry-readback",
            generation:manifest.generation,
            certificateIdentity:process.env.READBACK_IDENTITY,
            workflow:".github/workflows/provider-registry-readback.yml",
            requestId:process.env.REQUEST_ID,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            source:manifest.source,
            manifest:{path:"provider-registry-readback-manifest.json",digest:digest(manifestRaw)},
            readback:{path:manifest.readback.path,digest:manifest.readback.digest,bundlePath:manifest.readback.bundlePath,bundleDigest:digest(fs.readFileSync(`unsigned/${manifest.readback.bundlePath}`))},
          };
          fs.writeFileSync("unsigned/signed-provider-registry-readback-candidate.json", JSON.stringify(sorted(signed)));
          const files = ["provider-lifecycle-matrix.json","provider-readback.json","provider-readback.sigstore.json","provider-registry-readback-manifest.json","signed-provider-registry-readback-candidate.json"].sort();
          fs.writeFileSync("unsigned/SHA256SUMS", files.map((name) => `${digest(fs.readFileSync(`unsigned/${name}`)).slice(7)}  ${name}`).join("\n")+"\n");
          NODE
          (cd unsigned && sha256sum --check --strict SHA256SUMS)

      - name: Upload the signed Registry-readback candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takoform-provider-registry-readback-candidate-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.generate.outputs.source_commit_short }}
          path: unsigned/
          if-no-files-found: error
          retention-days: 90
